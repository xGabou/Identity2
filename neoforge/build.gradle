plugins {
    id 'com.github.johnrengelman.shadow'
    id 'com.matthewprenger.cursegradle' version '1.4.0' // CurseForge uploader
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            runDir "run-client"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    modImplementation "curse.maven:gabous-libs-1367332:7671005"
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "u8V1OwVf" // from your Modrinth project URL
    versionNumber = "NeoForge-${project.version}"
    versionName = "Identity ${mod_version}"
    changelog = rootProject.file("IdentityChangeLog.md").text
    gameVersions = ["1.21.4"]
    loaders = ["neoforge"]
    versionType = "beta"
    dependencies {
        required.project "lhGA9TYQ"
        required.project "N8aGZtvj"
    }
    uploadFile = file("build/libs/${archivesBaseName}-${version}.jar")
}
curseforge {
    apiKey = System.getenv("CURSEFORGE_TOKEN")

    project {
        id = "1238155"
        changelog = rootProject.file("IdentityChangeLog.md")
        releaseType = "beta" // options: alpha, beta, release
        addGameVersion "1.21.4"
        addGameVersion "NeoForge"
        mainArtifact(file("build/libs/${archivesBaseName}-${version}.jar")) {
            displayName = "NeoForge-${version}"
        }
    }
}
