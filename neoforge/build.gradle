import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.api.artifacts.type.ArtifactTypeDefinition
import org.gradle.api.file.FileSystemLocation
import org.gradle.api.provider.Provider

import java.util.zip.ZipEntry
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream

abstract class SanitizeGabouLibsForNeoForge implements TransformAction<TransformParameters.None> {
    @InputArtifact
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        def inputFile = inputArtifact.get().asFile
        def outputFile = outputs.file(inputFile.name.replace('.jar', '-loom-safe.jar'))

        new ZipInputStream(new BufferedInputStream(new FileInputStream(inputFile))).withCloseable { input ->
            new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(outputFile))).withCloseable { output ->
                ZipEntry entry
                while ((entry = input.nextEntry) != null) {
                    if (!SanitizeGabouLibsForNeoForge.isBundledLoaderEntry(entry.name)) {
                        output.putNextEntry(new ZipEntry(entry.name))
                        input.transferTo(output)
                        output.closeEntry()
                    }
                    input.closeEntry()
                }
            }
        }
    }

    private static boolean isBundledLoaderEntry(String name) {
        name == 'fabric-installer.json' ||
                name == 'fabric-installer.launchwrapper.json' ||
                name == 'architectury.accessWidener' ||
                name == 'architectury.common.json' ||
                name == 'architectury-common.mixins.json' ||
                name == 'LICENSE_fabric-loader' ||
                name == 'META-INF/jars/mixinextras-fabric-0.5.4.jar' ||
                name == 'META-INF/services/net.fabricmc.loader.impl.game.GameProvider' ||
                name == 'META-INF/services/net.fabricmc.tinyremapper.TinyRemapper$CLIExtensionProvider' ||
                name == 'META-INF/services/org.spongepowered.asm.service.IGlobalPropertyService' ||
                name == 'META-INF/services/org.spongepowered.asm.service.IMixinService' ||
                name == 'META-INF/services/org.spongepowered.asm.service.IMixinServiceBootstrap' ||
                name.startsWith('dev/architectury/') ||
                name.startsWith('net/fabricmc/') ||
                name.startsWith('META-INF/versions/17/net/fabricmc/') ||
                name.startsWith('assets/fabricloader/') ||
                name.startsWith('ui/icon/')
    }
}

apply plugin: 'com.gradleup.shadow'
apply plugin: 'com.hypherionmc.modutils.modpublisher'
apply plugin: "com.modrinth.minotaur"


architectury {
    platformSetupLoomIde()
    neoForge()
}
sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/resources')
    }
}

configurations {
    gabouLibsNeoForge {
        canBeResolved = true
        canBeConsumed = false
    }
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    registerTransform(SanitizeGabouLibsForNeoForge) {
        from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, ArtifactTypeDefinition.JAR_TYPE)
        to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'loom-safe-jar')
    }

    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    gabouLibsNeoForge("curse.maven:gabous-libs-1367332:8438440") { transitive = false }
    implementation configurations.gabouLibsNeoForge.incoming.artifactView {
        attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'loom-safe-jar')
    }.files
    runtimeOnly "curse.maven:animal-garden-snow-leopard-1477415:8294381"
    implementation "curse.maven:spark-361579:8275631"
    implementation "curse.maven:animal-garden-common-raven-1370539:8286121"
    implementation "curse.maven:aquarius-libs-1412710:8273136"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar
def modrinthToken = System.getenv("MODRINTH_TOKEN")?.trim()
def curseforgeToken = System.getenv("CURSEFORGE_TOKEN")?.trim()

if (modrinthToken) {
    modrinth {
        token = modrinthToken
        projectId = "u8V1OwVf" // from your Modrinth project URL
        versionNumber = "NeoForge-${project.version}-26.2"
        versionName = "Identity ${mod_version} for 26.2"
        changelog = rootProject.file("IdentityChangeLog.md").text
        gameVersions = ["26.2"]
        loaders = ["neoforge"]
        versionType = "beta"
        dependencies {
            required.project "lhGA9TYQ"
            required.project "N8aGZtvj"
        }
        uploadFile = project.tasks.named("shadowJar")
    }
} else {
    logger.lifecycle("Skipping Modrinth config for ${project.path}: MODRINTH_TOKEN is not set.")
    tasks.configureEach {
        if (name.toLowerCase().contains("modrinth")) {
            enabled = false
        }
    }
}

if (curseforgeToken) {
    publisher {
        apiKeys {
            curseforge curseforgeToken
        }
        setCurseID("1238155")
        setVersionType("beta")
        setChangelog(rootProject.file("IdentityChangeLog.md"))
        setDisplayName("NeoForge-${project.version}-26.2")
        setGameVersions("26.2")
        setLoaders("neoforge")
        setCurseEnvironment("both")
        getJavaVersions().set([JavaVersion.VERSION_21])
        setArtifact(tasks.named("shadowJar"))
        setDebug(providers.gradleProperty("publisherDebug")
                .map { it.toBoolean() }
                .orElse(false)
                .get())
    }
} else {
    logger.lifecycle("CURSEFORGE_TOKEN not set; CurseForge upload tasks will be disabled for ${project.path}.")
    tasks.named("publishCurseforge").configure { enabled = false }
}

tasks.named("publishCurseforge").configure {
    dependsOn(tasks.named("build"))
}

tasks.register("curseforge1238155") {
    group = "publishing"
    description = "Publishes the NeoForge release to CurseForge project 1238155."
    dependsOn(tasks.named("publishCurseforge"))
    enabled = curseforgeToken != null && !curseforgeToken.isEmpty()
}
