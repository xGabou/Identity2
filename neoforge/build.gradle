plugins {
    id 'com.github.johnrengelman.shadow'
    id 'com.hypherionmc.modutils.modpublisher'
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            runDir "run-client"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    modImplementation "curse.maven:gabous-libs-1367332:8774265"
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
def modrinthToken = System.getenv("MODRINTH_TOKEN")?.trim()
def curseforgeToken = System.getenv("CURSEFORGE_TOKEN")?.trim()

if (modrinthToken) {
    modrinth {
        token = modrinthToken
        projectId = "u8V1OwVf" // from your Modrinth project URL
        versionNumber = "NeoForge-${project.version}-1.21.1"
        versionName = "Identity ${mod_version} for 1.21.1"
        changelog = rootProject.file("docs/public/IdentityChangeLog.md").text
        gameVersions = ["1.21.1"]
        loaders = ["neoforge"]
        versionType = "release"
        dependencies {
            required.project "lhGA9TYQ"
            required.project "N8aGZtvj"
        }
        uploadFile = file("build/libs/${archivesBaseName}-${version}.jar")
    }
} else {
    logger.lifecycle("Skipping Modrinth config for ${project.path}: MODRINTH_TOKEN is not set.")
    tasks.configureEach {
        if (name.toLowerCase().contains("modrinth")) {
            enabled = false
        }
    }
}

if (curseforgeToken) {
    publisher {
        apiKeys {
            curseforge curseforgeToken
        }
        setCurseID("1238155")
        setVersionType("release")
        setChangelog(rootProject.file("docs/public/IdentityChangeLog.md"))
        setDisplayName("NeoForge-${project.version}-1.21.1")
        setGameVersions("1.21.1")
        setLoaders("neoforge")
        setCurseEnvironment("both")
        getJavaVersions().set([JavaVersion.VERSION_21])
        setArtifact(tasks.named("remapJar"))
    }
} else {
    logger.lifecycle("CURSEFORGE_TOKEN not set; CurseForge upload tasks will be disabled for ${project.path}.")
    tasks.named("publishCurseforge").configure { enabled = false }
}

tasks.named("publishCurseforge").configure {
    dependsOn(tasks.named("build"))
}

tasks.register("curseforge1238155") {
    group = "publishing"
    description = "Publishes the NeoForge release to CurseForge project 1238155."
    dependsOn(tasks.named("publishCurseforge"))
    enabled = curseforgeToken != null && !curseforgeToken.isEmpty()
}
