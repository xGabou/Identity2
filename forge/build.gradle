plugins {
    id 'com.github.johnrengelman.shadow'
    id 'com.hypherionmc.modutils.modpublisher'
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
}
loom {
    runs {
        client {
            client()
            runDir "run"
            vmArg "-Ddevauth.enabled=true"
            vmArg "-Ddevauth.account=main"
            vmArg "-Dlog4j2.level=DEBUG"
        }

        server {
            server()
            runDir "run"
            vmArg "-Dlog4j2.level=DEBUG"
        }

        data {
            data()
            runDir "run"
            programArgs "--mod", "identity2", "--all",
                    "--output", project(":common").file("src/generated/resources/").absolutePath,
                    "--existing", project(":common").file("src/main/resources/").absolutePath
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
//    runtimeClasspath.extendsFrom common
    // Dev runtime needs the Forge-transformed common output so Mixin sees Forge mappings, not intermediary ones.
    developmentForge.extendsFrom shadowCommon
}


dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    modImplementation include("io.github.llamalad7:mixinextras-forge:0.3.2")
    forgeRuntimeLibrary "io.github.llamalad7:mixinextras-common:0.3.2"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    modImplementation "curse.maven:gabous-libs-1367332:8774253"
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
    runtimeOnly("me.djtheredstoner:DevAuth-forge-latest:1.2.1")
    compileOnly "curse.maven:naturalist-627986:6863943"
    compileOnly "curse.maven:geckolib-388172:7553267"
    compileOnly "curse.maven:alexs-mobs-426558:5698791"
    compileOnly "curse.maven:midnightlib-488090:4980331"
    compileOnly "curse.maven:apotheosis-313970:6461960"
    forgeRuntimeLibrary "com.eliotlash.mclib:mclib:20"
    compileOnly "curse.maven:placebo-283644:6274231"
    compileOnly "curse.maven:patchouli-306770:7731017"
    compileOnly "curse.maven:apothic-attributes-898963:5634071"
    compileOnly "curse.maven:alexs-caves-924854:5848216"
    compileOnly "curse.maven:ice-and-fire-dragons-264231:5633453"
    //modImplementation "curse.maven:sonicraft-490147:6120917"
    modImplementation "curse.maven:curios-309927:6418456"
    modImplementation "curse.maven:geckolib-388172:7553267"
    modImplementation "curse.maven:citadel-331936:7476570"
    modImplementation "curse.maven:untamedwilds-457252:4779746"
    // Optional compatibility runtime used by `-PwithMobMods=true` dev runs.
    if (project.hasProperty("withMobMods")) {
        modRuntimeOnly "curse.maven:naturalist-627986:6863943"
        modRuntimeOnly "curse.maven:alexs-mobs-426558:5698791"
        modRuntimeOnly "curse.maven:midnightlib-488090:4980331"

    }

    // Forge-only compatibility runtime for `-PwithCaveAndDragonMods=true` smoke tests.
    if (project.hasProperty("withCaveAndDragonMods")) {
        modRuntimeOnly "curse.maven:alexs-caves-924854:5848216"
        modRuntimeOnly "curse.maven:ice-and-fire-dragons-264231:5633453"
    }
}
processResources {
    inputs.property "version", project.version.toString()

    // Forge dev runtime reads this config from forge resources via -mixin.config.
    from(project(":common").file("src/main/resources")) {
        include "identity2.mixins.json"
    }
    // Also ship the Forge-remapped refmap into the Forge resource output so dev runs don't pick up the intermediary common refmap.
    from({
        zipTree(configurations.shadowCommon.singleFile)
    }) {
        include "identity2-common-refmap.json"
    }

    filesMatching("META-INF/mods.toml") {
        expand("version": project.version.toString())
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude("fabric.mod.json")
    manifest {
        attributes("MixinConfigs": "identity2.mixins.json")
    }
}

remapJar {
    input.set(shadowJar.archiveFile)
    dependsOn(shadowJar)
    doLast {
        def jarExecutable = new File(System.getProperty("java.home"), "bin/jar.exe")
        exec {
            executable = jarExecutable.exists() ? jarExecutable.absolutePath : "jar"
            commandLine(
                executable,
                "uf",
                archiveFile.get().asFile.absolutePath,
                "-C",
                project.file("build/resources/main").absolutePath,
                "identity2.mixins.json"
            )
        }
    }
}

jar {
    archiveClassifier.set("dev")
}
def modrinthToken = System.getenv("MODRINTH_TOKEN")?.trim()
def curseforgeToken = System.getenv("CURSEFORGE_TOKEN")?.trim()

if (modrinthToken) {
    modrinth {
        token = modrinthToken
        projectId = "u8V1OwVf" // from your Modrinth project URL
        versionNumber = "Forge-${project.version}-1.20.1"
        versionName = "Identity ${mod_version} for 1.20.1"
        changelog = rootProject.file("docs/public/IdentityChangeLog.md").text
        gameVersions = ["1.20.1"]
        loaders = ["forge"]
        versionType = "release"
        dependencies {
            required.project "lhGA9TYQ"
            required.project "N8aGZtvj"
        }
        uploadFile = file("build/libs/${archivesBaseName}-${version}.jar")
    }
} else {
    logger.lifecycle("Skipping Modrinth config for ${project.path}: MODRINTH_TOKEN is not set.")
    tasks.configureEach {
        if (name.toLowerCase().contains("modrinth")) {
            enabled = false
        }
    }
}

if (curseforgeToken) {
    publisher {
        apiKeys {
            curseforge curseforgeToken
        }
        setCurseID("1238155")
        setVersionType("release")
        setChangelog(rootProject.file("docs/public/IdentityChangeLog.md"))
        setDisplayName("Forge-${project.version}-1.20.1")
        setGameVersions("1.20.1")
        setLoaders("forge")
        setCurseEnvironment("both")
        getJavaVersions().set([JavaVersion.VERSION_17])
        setArtifact(tasks.named("remapJar"))
    }
} else {
    logger.lifecycle("CURSEFORGE_TOKEN not set; CurseForge upload tasks will be disabled for ${project.path}.")
    tasks.named("publishCurseforge").configure { enabled = false }
}

tasks.named("publishCurseforge").configure {
    dependsOn(tasks.named("build"))
}

tasks.register("curseforge1238155") {
    group = "publishing"
    description = "Publishes the Forge release to CurseForge project 1238155."
    dependsOn(tasks.named("publishCurseforge"))
    enabled = curseforgeToken != null && !curseforgeToken.isEmpty()
}
