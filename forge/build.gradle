plugins {
    id 'com.github.johnrengelman.shadow'
    id 'com.matthewprenger.cursegradle' version '1.4.0' // CurseForge uploader
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
}
loom {
    forge {
        mixinConfigs = [
                "identity2.mixins.json",
        ]
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
//    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    modImplementation "curse.maven:gabous-libs-1367332:7701613"
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}
processResources {
    inputs.property "version", project.version.toString()

    // Forge dev runtime reads this config from forge resources via -mixin.config.
    from(project(":common").file("src/main/resources")) {
        include "identity2.mixins.json"
    }

    filesMatching("META-INF/mods.toml") {
        expand("version": project.version.toString())
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
    exclude("fabric.mod.json")
}

remapJar {
    input.set(shadowJar.archiveFile)
    dependsOn(shadowJar)
}

jar {
    archiveClassifier.set("dev")
}
def modrinthToken = System.getenv("MODRINTH_TOKEN")?.trim()
def curseforgeToken = System.getenv("CURSEFORGE_TOKEN")?.trim()

if (modrinthToken) {
    modrinth {
        token = modrinthToken
        projectId = "u8V1OwVf" // from your Modrinth project URL
        versionNumber = "Forge-${project.version}"
        versionName = "Identity ${mod_version}"
        changelog = rootProject.file("IdentityChangeLog.md").text
        gameVersions = ["1.20.1"]
        loaders = ["forge"]
        versionType = "release"
        dependencies {
            required.project "lhGA9TYQ"
            required.project "N8aGZtvj"
        }
        uploadFile = file("build/libs/${archivesBaseName}-${version}.jar")
    }
} else {
    logger.lifecycle("Skipping Modrinth config for ${project.path}: MODRINTH_TOKEN is not set.")
    tasks.configureEach {
        if (name.toLowerCase().contains("modrinth")) {
            enabled = false
        }
    }
}

if (curseforgeToken) {
    curseforge {
        apiKey = curseforgeToken

        project {
            id = "1238155"
            changelog = rootProject.file("IdentityChangeLog.md")
            releaseType = "release" // options: alpha, beta, release
            addGameVersion "1.20.1"
            addGameVersion "Forge"
            mainArtifact(file("build/libs/${archivesBaseName}-${version}.jar")) {
                displayName = "Forge-${version}"
            }
        }
    }
} else {
    logger.lifecycle("Skipping CurseForge config for ${project.path}: CURSEFORGE_TOKEN is not set.")
    tasks.configureEach {
        if (name.toLowerCase().contains("curseforge")) {
            enabled = false
        }
    }
}
