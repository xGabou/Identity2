plugins {
    id 'com.github.johnrengelman.shadow'
    id 'com.hypherionmc.modutils.modpublisher'
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        client {
            vmArg "-Ddevauth.enabled=true"
            vmArg "-Ddevauth.account=main"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def includeNaturalistInDevRuntime = !project.hasProperty("withoutNaturalist")

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation include("io.github.llamalad7:mixinextras-fabric:0.3.2")

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation "curse.maven:gabous-libs-1367332:8774260"
    modImplementation "curse.maven:geckolib-388172:7553256"
    if (includeNaturalistInDevRuntime) {
        modImplementation "curse.maven:naturalist-627986:6863939"
    } else {
        modCompileOnly "curse.maven:naturalist-627986:6863939"
    }
    runtimeOnly "curse.maven:midnightlib-488090:4980331"
    //runtimeOnly "me.djtheredstoner:DevAuth-fabric-latest:1.2.1"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
def modrinthToken = System.getenv("MODRINTH_TOKEN")?.trim()
def curseforgeToken = System.getenv("CURSEFORGE_TOKEN")?.trim()

if (modrinthToken) {
    modrinth {
        token = modrinthToken
        projectId = "u8V1OwVf" // from your Modrinth project URL
        versionNumber = "Fabric-${project.version}-1.20.1"
        versionName = "Identity ${mod_version} for 1.20.1"
        changelog = rootProject.file("docs/public/IdentityChangeLog.md").text
        gameVersions = ["1.20.1"]
        loaders = ["fabric"]
        versionType = "release"
        dependencies {
            required.project "mOgUt4GM"
            required.project "lhGA9TYQ"
            required.project "N8aGZtvj"
        }
        uploadFile = file("build/libs/${archivesBaseName}-${version}.jar")
    }
} else {
    logger.lifecycle("Skipping Modrinth config for ${project.path}: MODRINTH_TOKEN is not set.")
    tasks.configureEach {
        if (name.toLowerCase().contains("modrinth")) {
            enabled = false
        }
    }
}

if (curseforgeToken) {
    publisher {
        apiKeys {
            curseforge curseforgeToken
        }
        setCurseID("1238155")
        setVersionType("release")
        setChangelog(rootProject.file("docs/public/IdentityChangeLog.md"))
        setDisplayName("Fabric-${project.version}-1.20.1")
        setGameVersions("1.20.1")
        setLoaders("fabric")
        setCurseEnvironment("both")
        getJavaVersions().set([JavaVersion.VERSION_17])
        setArtifact(tasks.named("remapJar"))
    }
} else {
    logger.lifecycle("CURSEFORGE_TOKEN not set; CurseForge upload tasks will be disabled for ${project.path}.")
    tasks.named("publishCurseforge").configure { enabled = false }
}

tasks.named("publishCurseforge").configure {
    dependsOn(tasks.named("build"))
}

tasks.register("curseforge1238155") {
    group = "publishing"
    description = "Publishes the Fabric release to CurseForge project 1238155."
    dependsOn(tasks.named("publishCurseforge"))
    enabled = curseforgeToken != null && !curseforgeToken.isEmpty()
}
