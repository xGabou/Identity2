apply plugin: 'com.gradleup.shadow'
apply plugin: 'com.hypherionmc.modutils.modpublisher'
apply plugin: "com.modrinth.minotaur"


architectury {
    platformSetupLoomIde()
    fabric()
}
sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/resources')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    include(implementation('me.lucko:fabric-permissions-api:0.6.1'))

    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    implementation "curse.maven:gabous-libs-1367332:8438441"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar
def modrinthToken = System.getenv("MODRINTH_TOKEN")?.trim()
def curseforgeToken = System.getenv("CURSEFORGE_TOKEN")?.trim()

if (modrinthToken) {
    modrinth {
        token = modrinthToken
        projectId = "u8V1OwVf" // from your Modrinth project URL
        versionNumber = "Fabric-${project.version}"
        versionName = "Identity ${mod_version}"
        changelog = rootProject.file("IdentityChangeLog.md").text
        gameVersions = ["1.21.11"]
        loaders = ["fabric"]
        versionType = "release"
        dependencies {
            required.project "mOgUt4GM"
            required.project "lhGA9TYQ"
            required.project "N8aGZtvj"
        }
        uploadFile = project.tasks.named("shadowJar")
    }
} else {
    logger.lifecycle("Skipping Modrinth config for ${project.path}: MODRINTH_TOKEN is not set.")
    tasks.configureEach {
        if (name.toLowerCase().contains("modrinth")) {
            enabled = false
        }
    }
}

if (curseforgeToken) {
    publisher {
        apiKeys {
            curseforge curseforgeToken
        }
        setCurseID("1238155")
        setVersionType("release")
        setChangelog(rootProject.file("IdentityChangeLog.md"))
        setDisplayName("Fabric-${project.version}")
        setGameVersions("1.21.11")
        setLoaders("fabric")
        setCurseEnvironment("both")
        getJavaVersions().set([JavaVersion.VERSION_21])
        setArtifact(tasks.named("shadowJar"))
        setDebug(providers.gradleProperty("publisherDebug")
                .map { it.toBoolean() }
                .orElse(false)
                .get())
    }
} else {
    logger.lifecycle("CURSEFORGE_TOKEN not set; CurseForge upload tasks will be disabled for ${project.path}.")
    tasks.named("publishCurseforge").configure { enabled = false }
}

tasks.named("publishCurseforge").configure {
    dependsOn(tasks.named("build"))
}

tasks.register("curseforge1238155") {
    group = "publishing"
    description = "Publishes the Fabric release to CurseForge project 1238155."
    dependsOn(tasks.named("publishCurseforge"))
    enabled = curseforgeToken != null && !curseforgeToken.isEmpty()
}
