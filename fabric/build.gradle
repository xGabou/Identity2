plugins {
    id 'com.github.johnrengelman.shadow'
    id 'com.matthewprenger.cursegradle' version '1.4.0' // CurseForge uploader
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation include("io.github.llamalad7:mixinextras-fabric:0.3.2")

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation "curse.maven:gabous-libs-1367332:7701614"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
def modrinthToken = System.getenv("MODRINTH_TOKEN")?.trim()
def curseforgeToken = System.getenv("CURSEFORGE_TOKEN")?.trim()

if (modrinthToken) {
    modrinth {
        token = modrinthToken
        projectId = "u8V1OwVf" // from your Modrinth project URL
        versionNumber = "Fabric-${project.version}"
        versionName = "Identity ${mod_version}"
        changelog = rootProject.file("IdentityChangeLog.md").text
        gameVersions = ["1.20.4"]
        loaders = ["fabric"]
        versionType = "release"
        dependencies {
            required.project "mOgUt4GM"
            required.project "lhGA9TYQ"
            required.project "N8aGZtvj"
        }
        uploadFile = file("build/libs/${archivesBaseName}-${version}.jar")
    }
} else {
    logger.lifecycle("Skipping Modrinth config for ${project.path}: MODRINTH_TOKEN is not set.")
    tasks.configureEach {
        if (name.toLowerCase().contains("modrinth")) {
            enabled = false
        }
    }
}

if (curseforgeToken) {
    curseforge {
        apiKey = curseforgeToken

        project {
            id = "1238155"
            changelog = rootProject.file("IdentityChangeLog.md")
            releaseType = "release" // options: alpha, beta, release
            addGameVersion "1.20.4"
            addGameVersion "Fabric"
            mainArtifact(file("build/libs/${archivesBaseName}-${version}.jar")) {
                displayName = "Fabric-${version}"
            }
        }
    }
} else {
    logger.lifecycle("Skipping CurseForge config for ${project.path}: CURSEFORGE_TOKEN is not set.")
    tasks.configureEach {
        if (name.toLowerCase().contains("curseforge")) {
            enabled = false
        }
    }
}
